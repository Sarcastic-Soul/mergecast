# Pings the free Render demo so it doesn't fall asleep (Render sleeps after
# 15 idle minutes). GitHub may start scheduled runs late, hence every 5 minutes.
name: keep demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://mergecast.onrender.com/healthz
